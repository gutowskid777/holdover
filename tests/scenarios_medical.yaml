# Medical condition calls. Same keys as scenarios.yaml (see the top of scenarios.py).
# scenarios.py reads scenarios.yaml only: it needs a file option, or these appended, to run them.

- name: medical / heart attack with aspirin
  lines: ["my dad has really bad pressure in his chest and its going down his left arm hes sweating", "okay hes sitting", "yeah we have aspirin and hes not allergic", "done he chewed it", "no he doesnt have any"]
  protocols: [chestpain]
  visit: [heart, aspirin]
  never: [wall_care]
  final: finish

- name: medical / sharp chest pain after a strain is not treated as heart
  lines: ["my chest hurts", "done", "no its not pressure just a sharp spot", "yeah only when i twist or press on it i pulled something paddling", "done"]
  protocols: [chestpain]
  visit: [wall, wall_care]
  never: [aspirin, heart]
  final: wall_end


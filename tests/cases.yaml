# Backtest: things a panicked caller might say, and where each must land.
# Written the way speech-to-text hears them: messy, no punctuation, run-on.
triage:
  - ["my friend cut his leg open with a hatchet and theres blood everywhere", bleeding]
  - ["he slipped with the knife while gutting a fish and his hand is gushing", bleeding]
  - ["she fell on a rock and theres a deep gash on her arm it wont stop bleeding", bleeding]
  - ["theres so much blood oh my god", bleeding]
  - ["a branch went through his thigh and its bleeding bad", bleeding]
  - ["i spilled boiling water from the camp stove all over my hand", burn]
  - ["he fell into the campfire his arm is burned", burn]
  - ["the fuel canister flared up and burned her face", burn]
  - ["i grabbed the hot pan and my palm is blistering", burn]
  - ["i think i broke my ankle i heard it snap and i cant stand on it", fracture]
  - ["she fell off the trail and her wrist is bent the wrong way", fracture]
  - ["my buddy rolled his ankle really bad its huge and purple", fracture]
  - ["he landed on his arm and theres bone poking out", fracture]
  - ["a rattlesnake just bit me on the calf", snakebite]
  - ["something bit her in the grass i think it was a snake theres two holes", snakebite]
  - ["copperhead got my hand when i moved the log", snakebite]
  - ["he got stung by a bee and his face is swelling up and hes wheezing", allergic]
  - ["she ate trail mix with peanuts and now her throat is closing", allergic]
  - ["im covered in hives and my lips are puffy after that sting", allergic]
  - ["wasp stung him and he says he cant breathe right hes allergic", allergic]
  - ["my dad just collapsed and he isnt waking up", unresponsive]
  - ["shes not breathing i dont think shes breathing", unresponsive]
  - ["we pulled him out of the water and hes not moving", unresponsive]
  - ["he just dropped i cant find a pulse", unresponsive]
  - ["hes choking on a piece of jerky he cant talk", choking]
  - ["she swallowed something wrong and shes grabbing her throat turning blue", choking]
  - ["my kid is choking on a marshmallow", choking]
  - ["hes soaked from the river and shivering so hard he cant talk right", hypothermia]
  - ["she got lost in the snow overnight shes freezing and really confused", hypothermia]
  - ["my friend stopped shivering and hes just sleepy and cold as ice", hypothermia]
  - ["weve been hiking in the sun all day and shes dizzy and throwing up", heat]
  - ["hes burning up his skin is hot and dry and hes not making sense its so hot out", heat]
  - ["i got really bad cramps and feel faint its like a hundred degrees", heat]
  - ["hello", null]
  - ["i need help", null]
  - ["can you hear me", null]
  - ["oh god oh god please help us", null]
  - ["uh hi is this thing working", null]
  # mixed: the worse problem must win
  - ["he cut his arm and now hes passed out and not breathing", unresponsive]
  - ["she got stung and collapsed shes not responding", unresponsive]

